{% if invite %}
  <div class="banner invite-result">
    <p>The invite code, shown only this once:</p>
    <p><output class="invite-code">{{ invite.code }}</output>
      <button type="button" class="refresh-button js-copy-invite"
              data-code="{{ invite.code }}"
              aria-label="Copy the invite code">Copy</button>
    </p>
    <p>Expires {{ invite.expires_at | utc_time }}.</p>
  </div>
{% else %}
  <div class="banner banner-error" role="alert">{{ error }}</div>
{% endif %}
