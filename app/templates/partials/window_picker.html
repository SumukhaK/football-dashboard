<section class="window-picker" aria-label="Time window">
  {# A page with a filter of its own passes picker_query ("&type=fatal"), so
     changing the window keeps that filter instead of dropping it. #}
  {% for option in window_hours %}
  <button type="button" class="window-option{% if option == hours and not view_scope.custom %} is-active{% endif %}"
          {% if option == hours and not view_scope.custom %}aria-current="true"{% endif %}
          hx-get="{{ quick_url(request, picker_path, option) }}"
          hx-target="#{{ body_id }}" hx-swap="outerHTML"
          hx-indicator="#main-content"
          hx-push-url="{{ quick_url(request, page_path, option) }}">
    {{ window_span(option) }}
  </button>
  {% endfor %}
</section>
{% include "partials/scope_picker.html" %}
