<section class="window-picker" aria-label="Time window">
  {# A page with a filter of its own passes picker_query ("&type=fatal"), so
     changing the window keeps that filter instead of dropping it. #}
  {% for option in window_hours %}
  <button type="button" class="window-option{% if option == hours %} is-active{% endif %}"
          {% if option == hours %}aria-current="true"{% endif %}
          hx-get="{{ picker_path }}?hours={{ option }}{{ picker_query }}"
          hx-target="#{{ body_id }}" hx-swap="outerHTML"
          hx-push-url="{{ page_path }}?hours={{ option }}{{ picker_query }}">
    {{ window_span(option) }}
  </button>
  {% endfor %}
</section>
