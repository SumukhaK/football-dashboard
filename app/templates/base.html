<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Dashboard Console</title>
  <script nonce="{{ request.state.csp_nonce }}">
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (error) { saved = null; }
      document.documentElement.setAttribute("data-theme", saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/shell.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/scope.css">
  {% block styles %}{% endblock %}
</head>
<body class="shell" hx-history="false">
  {% include "partials/sidebar.html" %}
  <main class="shell-main" id="main-content">
    <p class="scope-loading-indicator" role="status" aria-live="polite">Loading selected period…</p>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/theme.js" defer></script>
  <script src="/static/auth.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
