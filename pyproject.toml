[project]
name = "football-dashboard"
version = "1.0.0"
description = "Read-only observability console for the Football Intelligence backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "google-cloud-logging>=3.17.0",
    "google-cloud-trace>=1.21.0",
    "google-cloud-error-reporting>=1.17.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "mypy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
# Test helpers are imported by bare name, as pytest puts these dirs on sys.path.
mypy_path = ["tests/sources", "tests/sources/gcp"]
# Google's exception classes have unannotated constructors.
untyped_calls_exclude = ["google.api_core.exceptions", "google.auth.exceptions"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
