[project]
name = "football-dashboard"
version = "1.0.0"
description = "Read-only observability console for the Football Intelligence backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic",
    "pydantic-settings",
    "google-cloud-logging>=3.17.0",
    "google-cloud-trace>=1.21.0",
    "google-cloud-error-reporting>=1.17.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-bigquery>=3.27",
    "authlib>=1.9.1",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
# Test helpers are imported by bare name, as pytest puts these dirs on sys.path.
# Explicit package bases keep same-named test modules (e.g. two test_overview.py)
# in distinct packages.
explicit_package_bases = true
mypy_path = [".", "tests/sources", "tests/sources/gcp"]
# Google's exception classes have unannotated constructors.
untyped_calls_exclude = ["google.api_core.exceptions", "google.auth.exceptions"]

[[tool.mypy.overrides]]
# Authlib ships no type information; its public API is exercised by the
# adapter tests, which use the real library rather than a stub.
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
